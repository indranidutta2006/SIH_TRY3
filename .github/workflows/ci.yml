# ==============================================================================
# SIH26138 – Green Fleet Navigator  •  Continuous Integration
#
# Triggers on every push and pull-request targeting main.
# Workflow:
#   1. Install runtime + dev dependencies (requirements.txt + pytest + pennylane)
#   2. Generate minimal test fixtures via scripts/ci_generate_fixtures.py:
#        Stage 1 — 500-row synthetic voyage dataset (data/raw/voyages_sample.csv)
#        Stage 2a — Train baseline models (artifacts/models/*.pkl +
#                   artifacts/metrics/baseline_metrics.json)
#      Intentionally OMITS: prediction benchmark, compliance spot-check,
#      fleet scheduler, QPSO/PSO scalability sweep, Pareto front, 6-fuel
#      scenario analysis.  Those are integration benchmarks belonging in
#      run_full_pipeline.py, not in a per-push correctness gate.
#      Expected fixture-generation time: ~25-35 s (vs ~2 m 30 s+ full pipeline)
#   3. Run the full pytest suite.  Any failure blocks the merge.
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "pytest · Python 3.12 · ubuntu-latest"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Dev / CI extras not in requirements.txt
          pip install pytest pytest-cov
          # PennyLane: required by models/fuel_predictor.py (QPSO layer)
          pip install pennylane

      # ── 4. Minimal fixture generation (data + model training only) ────────────
      #   Runs scripts/ci_generate_fixtures.py — intentionally omits the
      #   prediction benchmark, compliance spot-check, fleet scheduler,
      #   QPSO/PSO scalability sweep, Pareto front, and 6-fuel scenario
      #   analysis.  Those are benchmarks; this step only produces what
      #   pytest actually requires:
      #     • data/raw/voyages_sample.csv        (test_qifcp, test_dataset_loader, …)
      #     • artifacts/models/*.pkl             (test_model_manager)
      #     • artifacts/metrics/baseline_metrics.json  (test_model_manager)
      #   The script exits with code 1 if any required artifact is absent,
      #   so a generation failure is caught before pytest even starts.
      - name: Generate test fixtures (dataset + model training only)
        run: python scripts/ci_generate_fixtures.py --rows 500

      # ── 5. Test suite ─────────────────────────────────────────────────────────
      - name: Run pytest
        run: pytest -q --tb=short
